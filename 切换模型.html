<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>007学英语 · 切换服务商 / 模型</title>
<style>
/* 配色与主应用保持一致（纸、墨、钢笔蓝）。这页特意不依赖主应用的任何文件：
   万一应用打不开，它还得能单独用。 */
:root{--paper:#F7F6F2;--card:#FFFFFF;--sunk:#F0EEE8;--ink:#17181C;--ink2:#50545D;--mut:#8C9098;--line:#E3E0D8;
  --pen:#27458F;--ok:#1F7A54;--ok-bg:#E5F3EC;--bad:#B8392D;
  --display:'Iowan Old Style','Charter',Georgia,'Songti SC','PingFang SC','Microsoft YaHei',serif}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;margin:48px auto;padding:0 22px;line-height:1.7;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1{font-family:var(--display);font-size:28px;font-weight:900;line-height:1.25;padding-bottom:14px;border-bottom:1px solid var(--ink)}
code{background:var(--sunk);padding:2px 6px;border-radius:4px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
button{background:var(--ink);color:var(--paper);border:none;padding:9px 18px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{opacity:.86}
input,select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--ink2)}
.ok{color:var(--ok);font-weight:700} .bad{color:var(--bad);font-weight:700} .mut{color:var(--mut)}

body{max-width:680px}
.cur{background:var(--sunk);padding:14px 16px;border-left:2px solid var(--ink);font-size:14px;margin:20px 0}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row b{font-size:15px} .row .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.row button{margin-left:auto;white-space:nowrap}
.row.on{background:var(--ok-bg);padding-left:14px;padding-right:14px;border-bottom-color:transparent;border-radius:8px}
.row.on button{background:transparent;color:var(--ok);cursor:default}
.row.no button{background:var(--sunk);color:var(--mut);cursor:not-allowed}
.tip{font-size:13px;color:var(--mut);margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.mbox{margin:26px 0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.mbox button{margin-left:8px}
input{width:280px;font-family:ui-monospace,Menlo,Consolas,monospace}
</style></head><body>
<h1>切换 007学英语 使用的服务商 / 模型</h1>
<div class="cur" id="cur">读取中…</div>

<div id="list"></div>

<div class="mbox">
  <b style="font-size:14px">手动指定当前服务商的模型</b>
  <div class="d mut" style="font-size:12.5px;margin:4px 0 10px">
    通常不用在这里改——应用设置页里点「获取可用模型」可以直接从服务商拉列表来选，更准确。
  </div>
  <input id="m" placeholder="模型名"> <button onclick="saveModel()">保存模型</button>
  <span id="msaved"></span>
</div>

<p class="tip">改完请回到应用页面按 <b>Cmd + Shift + R</b> 刷新，新设置才会生效。<br>
生词本、学习记录不受影响。<br>
灰色按钮表示那家还没填过 API Key——请在应用设置页里选中它并填好密钥。<br><br>
应用里也能改：点顶部的调色板图标 → 拉到最底部 → 「更换服务商 / 模型」。</p>

<script>
var P={
  openrouter:{name:"OpenRouter",d:"一把钥匙调几十家模型，支持网页导入。国内需代理",def:"deepseek/deepseek-v4-pro"},
  deepseek:{name:"DeepSeek 深度求索",d:"国内直连免代理，便宜，日常推荐",def:"deepseek-chat"},
  moonshot:{name:"月之暗面 Kimi",d:"国内直连免代理，中文语感好",def:"kimi-latest"},
  zhipu:{name:"智谱 GLM",d:"国内直连免代理",def:"glm-4-plus"},
  qwen:{name:"阿里通义千问",d:"国内直连免代理，阿里云百炼平台",def:"qwen-plus"},
  siliconflow:{name:"硅基流动 SiliconFlow",d:"国内直连免代理，聚合开源模型，注册送额度",def:"deepseek-ai/DeepSeek-V3"},
  anthropic:{name:"Anthropic Claude",d:"官方接口。需代理，且必须是家宽 IP",def:"claude-sonnet-5"},
  openai:{name:"OpenAI",d:"官方接口。需代理，且必须是家宽 IP",def:"gpt-4o"},
  gemini:{name:"Google Gemini",d:"有免费额度。需代理",def:"gemini-2.5-flash"}
};
function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function getJSON(k){ try{ return JSON.parse(localStorage.getItem(k))||{}; }catch(e){ return {}; } }
function setJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ alert("写入失败："+e.message); return false; } }
function esc(v){ return String(v).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

var cur = get("dd-provider")||"openrouter";
if(!P[cur]) cur="openrouter";
var keys = getJSON("dd-keys-v1");
var models = getJSON("dd-models-v1");
// 兼容还没迁移过的老数据
if(!keys.openrouter){ var ok=get("dd-or-key"); if(ok) keys.openrouter=ok; }
if(!models.openrouter){ var om=get("dd-or-model"); if(om){ try{om=JSON.parse(om);}catch(e){} if(typeof om==="string") models.openrouter=om; } }

function draw(){
  var m = models[cur]||P[cur].def;
  document.getElementById("cur").innerHTML =
    "当前使用：<b>"+P[cur].name+"</b>　模型 <code>"+esc(m)+"</code>"+
    (keys[cur]?"":" <span style='color:#B5432F'>（这家还没填 API Key）</span>");
  document.getElementById("m").value = models[cur]||"";
  document.getElementById("m").placeholder = P[cur].def;
  var h="";
  for(var id in P){
    var on=(id===cur), has=!!keys[id];
    h += '<div class="row'+(on?" on":"")+(has?"":" no")+'">'+
         '<div><b>'+P[id].name+'</b><div class="d">'+P[id].d+
         (models[id]?'　·　当前模型 '+esc(models[id]):'')+'</div></div>'+
         '<button onclick="pick(\''+id+'\')"'+((on||!has)?" disabled":"")+'>'+
         (on?"使用中":(has?"切换":"未配置"))+'</button></div>';
  }
  document.getElementById("list").innerHTML=h;
}
function pick(id){
  if(!keys[id]) return;
  try{ localStorage.setItem("dd-provider",id); }catch(e){ alert("写入失败："+e.message); return; }
  cur=id; draw();
  document.getElementById("cur").innerHTML += ' <span class="ok">✓ 已切换</span>';
}
function saveModel(){
  var v=document.getElementById("m").value.trim();
  if(v) models[cur]=v; else delete models[cur];
  if(!setJSON("dd-models-v1",models)) return;
  draw();
  document.getElementById("msaved").innerHTML=' <span class="ok">✓ 已保存</span>';
}
draw();
</script></body></html>
