<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>007学英语 · 切换模型</title>
<style>
body{font-family:-apple-system,'PingFang SC',sans-serif;max-width:640px;margin:50px auto;padding:0 20px;line-height:1.7;color:#1C2B45;background:#FCFBF7}
h1{font-size:19px}
.cur{background:#F7F5EE;padding:14px;border-radius:8px;font-size:14px;margin:18px 0}
code{background:#EDF2FA;padding:2px 6px;border-radius:4px;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #E7E5DC;border-radius:8px;margin-bottom:10px;background:#fff}
.row b{font-size:14px} .row .d{font-size:12.5px;color:#8B94A6;margin-top:2px}
.row button{margin-left:auto;background:#2F5AA8;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.row.on{border-color:#2E7D5B;background:#E8F4EE}
.row.on button{background:#8B94A6;cursor:default}
.ok{color:#2E7D5B;font-weight:700}
.tip{font-size:13px;color:#8B94A6;margin-top:22px;border-top:1px solid #E7E5DC;padding-top:14px}
</style></head><body>
<h1>切换 007学英语 使用的模型</h1>
<div class="cur" id="cur">读取中…</div>
<div id="list"></div>
<p class="tip">改完请回到应用页面按 <b>Cmd + Shift + R</b> 刷新，新模型才会生效。<br>
生词本、学习记录不受影响。<br><br>
应用里也能改：点顶部的调色板图标 → 拉到最底部 → 「更换 Key / 模型」。</p>

<script>
var K="dd-or-model";
var MODELS=[
 ["deepseek/deepseek-v4-pro","质量更好，激活 49B，生成文章更地道（约 0.0035 元/篇）"],
 ["deepseek/deepseek-v4-flash","速度更快，激活 13B，日常查词翻译够用（约 0.0011 元/篇）"],
 ["deepseek/deepseek-v4-flash-0731","最便宜的快照版本（约 0.0007 元/篇）"],
 ["anthropic/claude-sonnet-4.6","换到原生 IP 节点后可用，否则会 403"]
];
function cur(){ try{ return localStorage.getItem(K)||""; }catch(e){ return ""; } }
function draw(){
  var c=cur();
  document.getElementById("cur").innerHTML = c
    ? "当前模型：<code>"+c+"</code>"
    : "当前未设置模型，应用会用内置默认值 <code>deepseek/deepseek-v4-pro</code>";
  var h="";
  MODELS.forEach(function(m){
    var on = (c===m[0]);
    h += '<div class="row'+(on?' on':'')+'"><div><b>'+m[0]+'</b><div class="d">'+m[1]+'</div></div>'+
         '<button onclick="pick(\''+m[0]+'\')"'+(on?' disabled':'')+'>'+(on?'使用中':'切换')+'</button></div>';
  });
  document.getElementById("list").innerHTML=h;
}
function pick(m){
  try{ localStorage.setItem(K,m); }catch(e){ alert("写入失败："+e.message); return; }
  draw();
  document.getElementById("cur").innerHTML += ' <span class="ok">✓ 已切换</span>';
}
draw();
</script></body></html>
